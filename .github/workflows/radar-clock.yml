# Déclencheur manuel de secours.
# Le fonctionnement périodique est désormais assuré directement par le cron de Radar Auto.
name: Radar Clock

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déclencher Radar Auto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tentative in 1 2 3; do
            if gh workflow run radar-auto.yml --repo "${GITHUB_REPOSITORY}" --ref main; then
              exit 0
            fi
            sleep 10
          done
          exit 1
