name: Radar

on:
  workflow_dispatch:
    inputs:
      query:
        description: Requête de veille
        default: Châteaubriant Loire-Atlantique
      only:
        description: Sources (ex. reddit,exa) — vide = toutes celles qui ont leurs clés
        default: ''
      since:
        description: Date plancher ISO (ex. 2026-09-01) — optionnel
        default: ''
  schedule:
    # Toutes les 15 min, décalé des pics de charge du début d'heure.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Syntaxe
        run: for f in *.mjs; do node --check "$f"; done
      - name: Tests
        run: npm test
      - name: Run stub
        run: node radar-run.mjs --stub --out ./dist
      - name: RSS valide
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('dist/radar.xml'); print('RSS valide')"

  veille:
    runs-on: ubuntu-latest
    needs: tests
    if: always() && (github.event_name == 'schedule' || needs.tests.result == 'success')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Mémoire des items déjà vus
        uses: actions/cache@v5
        with:
          path: .radar-state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-
      - name: Run réel
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          QUERY: ${{ github.event.inputs.query || 'Châteaubriant Loire-Atlantique' }}
          ONLY: ${{ github.event.inputs.only }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          set -o pipefail
          args=(--query "$QUERY" --out ./dist --state .radar-state/seen.json --every 15)
          [ -n "$ONLY" ]  && args+=(--only "$ONLY")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          node radar-run.mjs "${args[@]}" 2>&1 | tee ./dist-log.txt
      - name: Résumé
        if: always()
        run: '[ -f dist/radar.md ] && cat dist/radar.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: radar
          path: |
            dist/
            dist-log.txt
          if-no-files-found: warn
      - name: Préparer la publication
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publication:
    runs-on: ubuntu-latest
    needs: veille
    if: always() && needs.veille.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
