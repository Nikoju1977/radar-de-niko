name: Radar Auto

on:
  # Mise à jour automatique du flux RSS toutes les 15 minutes.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # Permet de valider immédiatement ce workflow lorsqu'il est modifié.
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-auto.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Mémoire des items déjà vus
        uses: actions/cache@v5
        with:
          path: .radar-state
          key: radar-auto-state-${{ github.run_id }}
          restore-keys: |
            radar-auto-state-
            radar-state-

      - name: Collecter les flux
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .radar-state
          node radar-run.mjs \
            --query "Châteaubriant Loire-Atlantique" \
            --out ./dist \
            --state .radar-state/seen.json \
            --every 15 \
            2>&1 | tee ./dist-log.txt

      - name: Vérifier le RSS généré
        run: |
          test -s dist/radar.xml
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('dist/radar.xml'); print('RSS valide')"

      - name: Résumé
        if: always()
        run: '[ -f dist/radar.md ] && cat dist/radar.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Archive de diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: radar-auto
          path: |
            dist/
            dist-log.txt
          if-no-files-found: warn

      - name: Préparer GitHub Pages
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publication:
    runs-on: ubuntu-latest
    needs: veille
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
