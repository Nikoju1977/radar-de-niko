name: Radar

on:
  workflow_dispatch:
    inputs:
      query:
        description: Requête de veille
        default: Châteaubriant Loire-Atlantique
      only:
        description: Collecteurs (ex. reddit)
        default: reddit
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: for f in *.mjs; do node --check "$f"; done
      - run: npm test
      - run: node radar-run.mjs --stub --out ./dist
      - run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('dist/radar.xml'); print('RSS valide')"

  veille:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run réel
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          node radar-run.mjs \
            --query "${{ github.event.inputs.query || 'Châteaubriant Loire-Atlantique' }}" \
            --only "${{ github.event.inputs.only || 'reddit' }}" \
            --out ./dist | tee ./dist-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: radar
          path: |
            dist/
            dist-log.txt
